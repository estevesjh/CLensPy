[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clenspy"
version = "0.1.0"
description = "A Python package for cluster gravitational lensing analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Johnny H. Esteves", email = "johnny.udi@gmail.com"},
]
keywords = ["cosmology", "weak lensing", "dark matter", "astronomy", "astrophysics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "astropy>=4.0.0",
    "matplotlib>=3.3.0",
    "mpmath>=1.3.0",
    "mcfit>=0.0.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-benchmark",
    "ruff",
]
mcmc = [
    "emcee>=3.0.0",
    "corner>=2.2.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-wagtail-theme>=6.3.0",
    "sphinx-copybutton>=0.5.2",
]
# Reference implementations used by tests/test_nfw.py and tests/test_twohalo.py
# to validate clenspy against independent codes. All skip gracefully if absent.
# `cluster_toolkit` is not on PyPI and needs GSL; install it manually, see
# docs/development.md.
compare = [
    "pyccl>=3.0",
    "clmm>=1.16",
    "camb>=1.5",
]
all = ["clenspy[dev,mcmc,docs,compare]"]

[project.urls]
Homepage = "https://github.com/estevesjh/clenspy"
Repository = "https://github.com/estevesjh/clenspy"
Documentation = "https://clenspy.readthedocs.io"
"Bug Tracker" = "https://github.com/estevesjh/clenspy/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clenspy*"]

[tool.setuptools.package-data]
clenspy = ["py.typed", "data/*.npz", "data/*.txt", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clenspy --cov-report=html --cov-report=term-missing"
markers = [
    "benchmark: marks tests as benchmark tests (deselect with '-m \"not benchmark\"')",
]

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "B", "I"]
ignore = []
exclude = ["build", "dist", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "seaborn>=0.13.2",
]
